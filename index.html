<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hotel Robot · Circular Screen</title>
<style>
/* 좌표계 : 피그마 1080 단위를 그대로 CSS px 로 쓰고 마지막에 통째로 scale()
   병원 로봇(dab2n/baton)과 같은 디자인 시스템. 스크린/베젤/하우징/배경 레이어는 동일하고
   장면(문구)만 호텔 시나리오로 갈아끼운다.

   그래픽 상태는 4가지뿐 : idle → fill → connect → full
     idle    중앙의 작은 구슬 (얼굴 대기). 큰 소리엔 가운데로 모여 듣는다
     fill    얼굴 인식 : 구슬이 중심으로 사라지고 위아래 띠가 한 바퀴 돌며 첫 문장 (엄지척 대기)
     connect 엄지척 인식 : 병원 로봇과 같은 별 모션 (문구 없음)
     full    문구 (스트로크는 가장자리에 계속)
     bye     마무리 : 마지막 화면이 걷히고 띠와 엔딩 멘트 → 띠가 돌며 지워지고 idle 로
   장면 목록은 아래 SCENES 배열 하나로만 관리한다.
*/

:root{ --fit: 1238; }          /* 미리보기 : 하우징 자리를 늘 비워둔다 */
body.kiosk{ --fit: 1080; }     /* #screen : 실기기 */

*{ box-sizing: border-box; }
/* 스크린 밖 여백 : 채도 낮은 검정에 가까운 남색 (병원 로봇과 동일) */
html,body{ height:100%; margin:0; overflow:hidden; background:#0B0F18; }
html:has(.shot), html:has(.shot) body{ background:transparent; }   /* ?s=N : 배경색 없이 UI 만 */
body{
  display:flex; align-items:center; justify-content:center;
  font-family:var(--ff-en,'Delight'), var(--ff-ko,'SF Pro KR'), 'Pretendard Web', system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
  cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none;
}
/* 자간 3% : letter-spacing 은 계산된 px 로 상속돼서 요소마다 em 을 다시 풀어준다 */
.device, .device *{ letter-spacing:0.03em; }

/* 한글 : 병원 로봇과 같은 SF Pro KR (한글 구간만) */
@font-face{ font-family:'SF Pro KR'; font-weight:600; font-display:block;
  src:url('fonts/SFProKR-Semibold.otf') format('opentype');
  unicode-range:U+1100-11FF, U+3130-318F, U+AC00-D7A3; }
@font-face{ font-family:'SF Pro KR'; font-weight:700; font-display:block;
  src:url('fonts/SFProKR-Bold.otf') format('opentype');
  unicode-range:U+1100-11FF, U+3130-318F, U+AC00-D7A3; }
/* 폰트 대체 : Delight 가 없는 컴퓨터(배포 링크)에선 Pretendard 로. 자간은 굵기·크기별 실측 보정 */
@font-face{ font-family:'Pretendard Web'; font-weight:400; font-display:swap;
  src:local('Pretendard Regular'), local('Pretendard-Regular'), url('pretendard/Pretendard-Regular.subset.woff2') format('woff2'); }
@font-face{ font-family:'Pretendard Web'; font-weight:500; font-display:swap;
  src:local('Pretendard Medium'), local('Pretendard-Medium'), url('pretendard/Pretendard-Medium.subset.woff2') format('woff2'); }
@font-face{ font-family:'Pretendard Web'; font-weight:600; font-display:swap;
  src:local('Pretendard SemiBold'), local('Pretendard-SemiBold'), url('pretendard/Pretendard-SemiBold.subset.woff2') format('woff2'); }
@font-face{ font-family:'Pretendard Web'; font-weight:700; font-display:swap;
  src:local('Pretendard Bold'), local('Pretendard-Bold'), url('pretendard/Pretendard-Bold.subset.woff2') format('woff2'); }
html.fb-en{ --ff-en:'Pretendard Web'; }
html.fb-en .headline, html.fb-en .headline *{ letter-spacing:0.0256em; }   /* 500 76 */
html.fb-en .headline em, html.fb-en .headline em *{ letter-spacing:0.0366em; }
html.fb-en .meta, html.fb-en .meta *{ letter-spacing:0.0165em; }           /* 400 52 */

.device{ position:relative; width:1080px; height:1080px; flex:none; transform:scale(var(--s,1)); }

/* ---------- 제품 하우징 ---------- */
.ring{
  position:absolute; inset:-78.8px; border-radius:50%;
  background:#f3e682;
  box-shadow:0 24px 70px rgba(0,0,0,.16);
}
.ring::before{
  content:''; position:absolute; inset:23.2px; border-radius:50%;
  background:radial-gradient(circle closest-side,#cdc47e 90.4%,#fff8c1 100%);
}
body.bare .ring{ display:none; }

/* ---------- 목업 토글 ---------- */
.toggle{
  position:fixed; right:16px; top:50%; translate:0 -50%; z-index:10;
  display:flex; align-items:center; gap:9px;
  padding:9px 14px 9px 10px; border:1px solid rgba(0,0,0,.14); border-radius:999px;
  background:#fff; color:#000; cursor:pointer;
  font:inherit; font-size:12px; font-weight:500; line-height:1;
  box-shadow:0 2px 12px rgba(0,0,0,.14);
}
.toggle:hover{ background:#f2f2f2; }
.toggle .sw{ width:34px; height:20px; border-radius:999px; flex:none;
             background:#000; transition:background-color .2s; }
.toggle .sw::after{ content:''; display:block; width:16px; height:16px; margin:2px;
                    border-radius:50%; background:#fff;
                    transform:translateX(14px); transition:transform .2s; }
body.bare .toggle:not(.camt) .sw{ background:#d6d6d6; }
body.bare .toggle:not(.camt) .sw::after{ transform:none; }
/* 카메라 영역 토글 : 목업 토글 아래에. 끄면 썸네일만 감추고 인식은 계속한다 */
.toggle.camt{ translate:0 calc(-50% + 46px); }
body.nocam .toggle.camt .sw{ background:#d6d6d6; }
body.nocam .toggle.camt .sw::after{ transform:none; }
body.nocam .cam{ opacity:0; pointer-events:none; }
body.nocam .bezel{ display:none; }   /* 스크린 위에 그려 둔 카메라 자리(반원)도 같이 지운다 */
body.kiosk .toggle, body.rec .toggle{ display:none; }

/* 카메라 모니터 (테스트용) */
.cam{ position:fixed; right:16px; bottom:16px; z-index:10; width:240px; }
.camview{ display:grid; aspect-ratio:4/3; border-radius:10px; overflow:hidden;
          background:#111; box-shadow:0 2px 12px rgba(0,0,0,.18); }
.camview > *{ grid-area:1/1; width:100%; height:100%; transform:scaleX(-1); }
.camview video{ object-fit:cover; }
.camstat{ margin-top:6px; font-size:11px; line-height:1.5; color:#888;
          text-align:right; white-space:pre-line; }
body.kiosk .cam, body.rec .cam{ display:none; }   /* ?rec=1 : 영상용 (병원·헬스장과 같은 플래그) */

/* ---------- 스크린 1080x1080 ---------- */
.screen{
  position:absolute; inset:0; border-radius:50%;
  background:#000;
  overflow:hidden;
  clip-path:circle(520px at 540px 540px);
}
/* 위아래 색 띠 (피그마 3124:17775 의 감청 / 밝은 회색) :
   직선 그라디언트는 검은 화면에서 경계가 가로줄로 보인다 → 스크린과 같은 중심(540,540)의 동심원으로 번지게 하고
   위/아래 방향은 아주 긴 마스크로만 나눈다. 등색선이 테두리와 같은 곡률(가운데가 높고 옆이 낮다)로 휜다 */
.screen::before, .screen::after{ content:''; position:absolute; inset:0; pointer-events:none;
  transition:opacity 1.4s ease; }   /* idle → fill 로 넘어갈 때 뚝 켜지지 않고 스며 나온다 */
/* 색은 피그마 그라디언트 바 그대로 (9% #0F1627 → 33% 검정 → 80% 검정 → 98% #3D3D3D).
   세지 않게, 경계가 길게 풀리도록 마스크를 넓혔다 */
.screen::before{   /* 위 : 감청 */
  background:radial-gradient(circle 530px at 540px 540px, rgba(15,22,39,0) 44%, rgba(15,22,39,.3) 70%, rgba(15,22,39,.62) 88%, #0F1627 98%, #0F1627 100%);
  -webkit-mask:linear-gradient(180deg,#000 0 6%, rgba(0,0,0,.9) 20%, rgba(0,0,0,.55) 32%, transparent 58%);
          mask:linear-gradient(180deg,#000 0 6%, rgba(0,0,0,.9) 20%, rgba(0,0,0,.55) 32%, transparent 58%); }
.screen::after{    /* 아래 : 회색 */
  background:radial-gradient(circle 530px at 540px 540px, rgba(61,61,61,0) 52%, rgba(61,61,61,.12) 78%, rgba(61,61,61,.24) 92%, rgba(61,61,61,.62) 99%, rgba(61,61,61,.62) 100%);
  -webkit-mask:linear-gradient(0deg,#000 0 2%, rgba(0,0,0,.5) 12%, rgba(0,0,0,.26) 26%, transparent 46%);
          mask:linear-gradient(0deg,#000 0 2%, rgba(0,0,0,.5) 12%, rgba(0,0,0,.26) 26%, transparent 46%); }
/* 기본 화면(얼굴 인식 전)은 위아래 아무것도 없이 순검정. 띠는 구슬이 커질 때부터 */
body.idle .screen::before, body.idle .screen::after, body.idle .rimlight{ opacity:0; }
/* 그 색이 가장자리를 따라 아주 천천히 돈다 : 원뿔 그라디언트를 테두리 쪽만 남기고 회전 */
.rimlight{ position:absolute; inset:-8%; pointer-events:none;
  background:conic-gradient(from 0deg,
    rgba(30,44,76,0)    0deg, rgba(36,52,90,.5)   55deg, rgba(22,29,48,0)  135deg,
    rgba(62,69,83,0)  205deg, rgba(62,69,83,.4)  275deg, rgba(30,44,76,0)  360deg);
  -webkit-mask:radial-gradient(circle closest-side, transparent 70%, #000 92%);
          mask:radial-gradient(circle closest-side, transparent 70%, #000 92%);
  opacity:.55; transition:opacity 1.4s ease; animation:rimOrbit 18s linear infinite; }
@keyframes rimOrbit{ to{ rotate:360deg; } }
/* 다가감 : 띠는 캔버스(.bandc)가 12시부터 한 바퀴 그리며 나타난다 (병원과 같다) */
body.fill .screen::before, body.fill .screen::after{ opacity:0; transition:none; }
body.fill .bandc{ opacity:.85; }
@keyframes rimIn{ 0%, 15%{ opacity:0; } 100%{ opacity:.35; } }   /* 병원과 같은 등장 */
body.fill .rimlight{ opacity:.35; animation:rimIn 2s both, rimOrbit 18s linear infinite; }
.bezel{ position:absolute; inset:0; width:1080px; height:1080px;
        z-index:4; pointer-events:none; }

/* ---------- 배경 레이어 ---------- */
.blur39{ position:absolute; inset:0; filter:blur(39px); transition:filter .8s ease; }
.field{ position:absolute; left:28px; top:-132px; width:1022px; height:1053px;
        border-radius:50%; background:linear-gradient(180deg,#fff 23.89%,#f6e280 100%); }
.sheen{ position:absolute; left:413px; top:-72px; width:424px; height:420px;
        border-radius:50%; background:#def2ff; opacity:.82; filter:blur(100px); }
.core { position:absolute; left:330px; top:454px; width:332px; height:328px;
        border-radius:50%; background:#fdffde; filter:blur(100px); }
.cyan { position:absolute; left:31px; top:-186px; width:1116px; height:828px;
        opacity:.27; filter:blur(100px); }

.field,.sheen,.core,.cyan{
  transform-origin:50% 50%;
  transition:transform 1.8s cubic-bezier(.45,0,.15,1), opacity 1.2s ease,
             translate 1.2s ease, scale 1.2s ease, rotate 1.2s ease,
             border-radius 1.2s ease, --k 1.1s cubic-bezier(.45,0,.25,1);
}

body.idle   .field{ transform:translate(1px,145.5px) scale(.22); }
/* 다가감 : 구슬은 중심으로 작아지며 어두워져 사라진다 (병원과 같다) */
body.fill   .field{ transform:translate(1px,145.5px) scale(.16); opacity:0; }
body.fill   .blur39{ filter:blur(30px); }
/* 엄지척 : 구슬은 그 자리·그 모습(노랑) 그대로 옅어지며 사라진다 (흑백으로 바뀌며 커지면 흰 덩어리가 별 모션을 흐린다) */
body.connect .field{ transform:translate(1px,145.5px) scale(.22); opacity:0; transition-duration:1.8s, .6s, 1.2s, 1.2s, 1.2s, 1.2s, 1.1s; }
body.connect .blur39{ filter:blur(17px); }
body.full   .field{ transform:translate(1px,145.5px) scale(1.2); opacity:0; }
/* 색 블롭은 idle 에서만 : 검은 화면에선 파랗고 누렇게 비친다 */
body:not(.idle) .sheen, body:not(.idle) .core, body:not(.idle) .cyan{ opacity:0; }

body.idle .sheen{ opacity:0; }
body.idle .core, body.fill .core{ transform:scale(.4); opacity:0; }
body.connect .core{ transform:translate(9px,-29px); }
body.idle .cyan, body.fill .cyan{
  transform:translate(9px,172.5px) scale(.469); opacity:.09;
}

/* 살아있는 구슬 : idle 에서만 배회하고, 채워진 뒤에는 고정 */
body.idle .field{
  animation:wander 30s linear      infinite,
            ripple  6s ease-in-out infinite,
            sway    7s ease-in-out infinite alternate,
            glowBreath 2.6s ease-in-out infinite alternate;
  --m:calc(1 - var(--k));
  translate:calc(var(--wx) * var(--m)) calc(var(--wy) * var(--m));
  /* 구슬 상자가 1022×1053 이라 집중할 때 세로를 1022/1053 로 눌러 정원을 만든다 */
  scale:calc(1 + (var(--sx) - 1) * var(--m)) calc((1 + (var(--sy) - 1) * var(--m)) * (1 - .0294 * var(--k)));
  /* 가장자리 번짐 : 늘 숨쉬고(--b) 있지만 세기는 k 를 곱해 집중할 때만 보인다 */
  /* 좁게(번짐 약 8~13px) · 숨을 들이쉴수록 흰빛 → 노란빛으로 짙어진다. 값은 구슬 좌표(×.22 로 줄어든다) */
  box-shadow:0 0 calc(34px + 26px * var(--b)) calc(4px + 10px * var(--b))
             rgba(255, calc(253 - 33 * var(--b)), calc(240 - 150 * var(--b)), calc(var(--k) * (.45 + .5 * var(--b))));
  rotate:calc(var(--rot) * var(--m));
  border-radius:calc(50% + var(--ra) * var(--m) * 1%) calc(50% - var(--ra) * var(--m) * 1%)
                calc(50% + var(--rb) * var(--m) * 1%) calc(50% - var(--rb) * var(--m) * 1%) /
                calc(50% + var(--rc) * var(--m) * 1%) calc(50% + var(--rd) * var(--m) * 1%)
                calc(50% - var(--rd) * var(--m) * 1%) calc(50% - var(--rc) * var(--m) * 1%);
}
/* 듣는 중 (큰 소리) : 배회는 멈추지 않고 그 폭(k)만 0 으로 줄인다.
   그래서 어디에 있든 그 자리에서 가운데로 미끄러져 오고, 풀리면 같은 궤적으로 다시 흘러나간다 — 한 물체처럼.
   흐림은 몸통에서 빠지고 가장자리 발광 링으로만 옮겨 간다 */
@property --k  { syntax:'<number>'; inherits:false; initial-value:0; }
@property --wx { syntax:'<length>'; inherits:false; initial-value:0px; }
@property --wy { syntax:'<length>'; inherits:false; initial-value:0px; }
@property --sx { syntax:'<number>'; inherits:false; initial-value:1; }
@property --sy { syntax:'<number>'; inherits:false; initial-value:1; }
@property --rot{ syntax:'<angle>';  inherits:false; initial-value:0deg; }
@property --ra { syntax:'<number>'; inherits:false; initial-value:0; }
@property --rb { syntax:'<number>'; inherits:false; initial-value:0; }
@property --rc { syntax:'<number>'; inherits:false; initial-value:0; }
@property --rd { syntax:'<number>'; inherits:false; initial-value:0; }
body.idle.listen .field{ --k:1; }
body.idle.listen .blur39{ filter:blur(.6px); transition-duration:1.1s; }
body.idle.listen .field::before{ filter:opacity(0); }   /* opacity 는 gleam 이 쥐고 있어 filter 로 끈다 */
@property --b  { syntax:'<number>'; inherits:false; initial-value:0; }
@keyframes glowBreath{ from{ --b:0; } to{ --b:1; } }
/* 눈길 끌기 (5초 동안 얼굴이 안 보이면) : 구슬이 네 알로 나뉘어 튀어 나갔다가 십자로 자리 잡고 두근거린 뒤 다시 하나로.
   구슬은 그동안 투명하게 가운데로 옮겨 두어(k=1) 네 알이 가운데에서 합쳐질 때 그 자리에서 다시 떠오른다 */
.attn{ position:absolute; inset:0; pointer-events:none; }
.ad{ position:absolute; left:485px; top:485px; width:110px; height:110px; border-radius:50%; opacity:0;
     background:radial-gradient(circle, var(--c) 58%, color-mix(in srgb, var(--c) 0%, transparent) 100%); filter:blur(5px); }
.ad:nth-child(1){ --c:#F9F8C8; }   /* 노랑 : 위 */
.ad:nth-child(2){ --c:#C4F0F8; }   /* 하늘 : 오른쪽 */
.ad:nth-child(3){ --c:#D3F3D7; }   /* 민트 : 아래 */
.ad:nth-child(4){ --c:#FFFFFF; }   /* 흰색 : 왼쪽 */
body.idle.attn .field{ --k:1; opacity:0; transition-duration:1.8s, .35s, 1.2s, 1.2s, 1.2s, 1.2s, 1.1s; }
/* 발광 링 : 구슬 바깥 테두리만 밝게. 안쪽 그라디언트는 원래대로 둔다 */
.field::before{
  content:''; position:absolute; inset:-9%; border-radius:inherit;
  opacity:0; transition:opacity .8s ease, filter 1.1s ease;
  background:conic-gradient(from 0deg,
    rgba(255,250,214,1) 0deg, rgba(255,246,196,.3) 100deg,
    rgba(255,246,196,.1) 190deg, rgba(255,248,204,.45) 280deg, rgba(255,250,214,1) 360deg);
  -webkit-mask:radial-gradient(circle closest-side, transparent 68%, #000 88%, #000 100%);
          mask:radial-gradient(circle closest-side, transparent 68%, #000 88%, #000 100%);
}
body.idle .field::before{ opacity:1; animation:gleam 9s ease-in-out infinite; }
@keyframes gleam{
   0%  { rotate:  0deg; opacity:.5;  }
  22%  { rotate:132deg; opacity:1;   }
  38%  { rotate: 98deg; opacity:.62; }
  62%  { rotate:254deg; opacity:1;   }
  80%  { rotate:222deg; opacity:.55; }
 100%  { rotate:360deg; opacity:.5;  }
}
body.idle .blur39{ filter:blur(17px); }
/* 정적 장면에서 .field 를 움직이면 검정이 드러난다. 고정하고 위의 블롭만 흘린다 */
body:not(.idle) .field{ animation:none; translate:0 0; scale:1; rotate:0deg; border-radius:50%; }
.sheen{ animation:drift2  9s ease-in-out infinite alternate; }
.core { animation:drift4 11s ease-in-out infinite alternate; }
.cyan { animation:drift3 13s ease-in-out infinite alternate; }
@keyframes wander{
   0%  { --wx:  0px; --wy:  0px; --sx:1;    --sy:1;    animation-timing-function:cubic-bezier(.28,.86,.3,1); }
   7%  { --wx:-46px; --wy:-30px; --sx:1.09; --sy:.93;  animation-timing-function:cubic-bezier(.5,0,.5,1);    }
  25%  { --wx:-38px; --wy:-22px; --sx:1.01; --sy:1;    animation-timing-function:cubic-bezier(.28,.86,.3,1); }
  32%  { --wx: 30px; --wy:-54px; --sx:.92;  --sy:1.11; animation-timing-function:cubic-bezier(.5,0,.5,1);    }
  48%  { --wx: 24px; --wy:-44px; --sx:1;    --sy:1;    animation-timing-function:cubic-bezier(.28,.86,.3,1); }
  54%  { --wx: 56px; --wy: 18px; --sx:1.08; --sy:.94;  animation-timing-function:cubic-bezier(.5,0,.5,1);    }
  70%  { --wx: 48px; --wy: 14px; --sx:1;    --sy:1.01; animation-timing-function:cubic-bezier(.28,.86,.3,1); }
  77%  { --wx:-28px; --wy: 48px; --sx:.94;  --sy:1.08; animation-timing-function:cubic-bezier(.5,0,.5,1);    }

/* ---------- connect : 병원 로봇(dab2n/baton)의 별 모션 · 스트로크를 그대로 ----------
   검정 위에 얹으므로 screen : 영상의 검은 부분은 배경 그라디언트가 그대로 비친다 */
.star{ position:absolute; inset:0; width:1080px; height:1080px; object-fit:cover; z-index:2;
       opacity:0; transition:opacity .45s ease; mix-blend-mode:screen; pointer-events:none; }

   실측(인코딩 결과) : 절정 1.9s 에 중심 540.4,541.5 · R 521.7 (스크린 반지름 520) */

/* ---------- 요청 보내기 (피그마 1284:449) ----------
   스트로크 영상은 쓰지 않는다. 칩이 위에서 내려오고, 아래에서 푸른 빛이 올라와 일렁이며 Sending 이 쓰인다 */
.chip{ position:absolute; left:50%; top:152px; translate:-50% 0; z-index:3; opacity:0;
  display:flex; align-items:center; gap:16px; padding:16px 40px 18px 32px;
  border-radius:90px; white-space:nowrap; pointer-events:none;

.chip.to  { background:radial-gradient(266px 66px at 50% 32%, rgba(30,37,54,.8) 61%, rgba(36,56,94,.48) 90%); }
.chip.sent{ background:radial-gradient(264px 66px at 50% 32%, rgba(0,0,0,.45) 61%, rgba(255,252,245,.46) 90%);
  box-shadow:0 18px 25.4px rgba(8,11,20,.8), inset 0 0 12px rgba(255,244,183,.38); }
.chip .too{ display:flex; align-items:flex-end; gap:4px; }   /* To + 마침표 (피그마 : 4px 점이 글자 밑줄에 붙는다) */
.chip .dg{ display:flex; align-items:flex-end; }

@keyframes chipIn { from{ opacity:0; translate:-50% -120px; } to{ opacity:1; translate:-50% 0; } }
@keyframes chipOut{ from{ opacity:1; translate:-50% 0; }    to{ opacity:0; translate:-50% 120px; } }
body.send .chip.to  { animation:chipIn .7s cubic-bezier(.22,.7,.25,1) both; }
body.sent .chip.to  { animation:chipOut .55s cubic-bezier(.4,0,.7,.4) both; }
/* 보냈다 칩은 알림 : 내려와 서서 2.2초 머물고 물러난다 (그 뒤 가운데 문장이 주인공) */
body.sent .chip.sent{ animation:chipNotice 3.1s linear .25s both; }
@keyframes chipNotice{

  22.6% { opacity:1; translate:-50% 0; animation-timing-function:linear; }

  100%  { opacity:0; translate:-50% -26px; }

.sendfx{ position:absolute; inset:0; z-index:2; pointer-events:none; border-radius:50%;

.sendfx::before, .sendfx::after{ content:''; position:absolute; inset:0; }
.sendfx::before{ background:radial-gradient(437px 181px at 509px 902px, #3d67cf 0%, rgba(32,58,140,.85) 42%, rgba(16,26,66,0) 76%); filter:blur(33px); }

/* 보냈다 : 아래로 내려가는 게 아니라 가장자리 쪽으로 번져 나가며 옅어진다 */
body.sent .sendfx{ opacity:0; translate:0 0; scale:1.45;
  transition:opacity 1.05s cubic-bezier(.3,0,.5,1), scale 1.25s cubic-bezier(.2,.6,.3,1); }

}

  61%     { translate:-12px -5px; scale:1.08 .96; }

/* Sending : 글자 아래끝이 980, 그 뒤로 점 세 개가 차례로 튄다 */
.sending{ position:absolute; left:50%; top:980px; translate:-50% -100%; z-index:3; margin:0;

/* 보내는 동안 : 하던 말은 자리에 둔 채 옅어지고 흐려진다 (피그마 : 투명도 20%) */

   띠를 절반 해상도 캔버스(.bandc)에 직접 그린다 (부드러운 그라디언트라 해상도 차이가 보이지 않는다). 그리는 법은 JS drawBands */

/* 반응이 없으면(15s) 또는 사람이 보이지 않으면(4s) 문구가 아래로 빠지며 기본 화면으로 (병원과 같다) */

.stage{

/* 숫자 : 병원 로봇 길안내와 같은 5x7 도트 (폰트 대신 직접 그린다).

/* 스트로크 톤 : 링 영상처럼 흰빛에서 아래로 은회색, 옅은 푸른 번짐 */
.countdots{ display:block; overflow:visible; animation:countIn .5s ease both; }

.headline{ font-size:76px; font-weight:500; line-height:1.45; }

   색은 글자(.c)마다 입힌다 : 단어(.w)에 입히면 background-clip:text 가 아직 안 켜진 글자까지 그려 단어가 통째로 먼저 보인다 */

   blur 를 em 단위로 : 호텔도 헬스장과 같이 글자가 76px 이라 px 로 고정하면 번짐이 너무 작다 */
.glim{ position:relative; }
.glim::before, .glim::after{ content:attr(data-t); position:absolute; left:0; top:0;
  color:#FEFFF9; white-space:nowrap; pointer-events:none; text-align:left; opacity:0;
  animation:glimWipe calc(var(--tn) * 1ms + 500ms) cubic-bezier(.3,.5,.4,1) both;
  animation-delay:calc(var(--t0) * 1ms); }   /* 강조어의 첫 글자가 켜질 때 시작해 마지막 글자까지 훑는다 */
/* 마스크 두 겹 : 오른쪽으로 갈수록 짙어지는 번짐 + 왼→오로 열리는 와이프 (교집합).
   글자가 왼쪽부터 나타나는 것과 같은 방향·같은 시각에 번짐이 따라온다 */

}

    <!-- 연결 인식 모션. 원본 AE : ~/Desktop/grad_motion1.aep
         내보낸 별.mp4(1920x1080)를 구가 중앙에 오도록 crop=1080:1080:10:0 해서 넣었다 -->
    <video class="star" muted playsinline preload="auto" aria-hidden="true">
      <source src="star.webm?v=7" type="video/webm">
      <source src="star.mp4?v=7"  type="video/mp4">
    </video>
    <!-- 요청 보내기 : 칩(위) · 하단 글로우 · Sending (피그마 1284:449) -->
    <div class="chip to" aria-hidden="true">
      <span class="too"><span class="dg">To</span><i class="pt"></i></span>
      <span class="dest">Hotel Lobby</span>
    </div>
    <div class="chip sent" aria-hidden="true">
      <svg class="ck" viewBox="0 0 26 24" aria-hidden="true">
        <circle cx="2" cy="14" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="9" cy="22" r="2"/><circle cx="13" cy="18" r="2"/>
        <circle cx="15" cy="14" r="2"/><circle cx="18" cy="10" r="2"/><circle cx="21" cy="6" r="2"/><circle cx="24" cy="2" r="2"/>
      </svg>
      <span class="dest">Request sent</span>
    </div>
    <div class="sendfx" aria-hidden="true"></div>
    <p class="sending" aria-hidden="true"><span class="t">Sending</span><span class="ld"><i></i><i></i><i></i></span></p>

    <div class="stage"></div>

    <!-- 카메라 노치 : .screen 안에 두어 같은 clip-path 로 잘리게 한다. 베젤은 그리지 않는다 -->
    <svg class="bezel" viewBox="0 0 1080 1080" aria-hidden="true">
      <ellipse cx="540" cy="-10" rx="86" ry="88" fill="#000"/>
    </svg>

  </div>

</div>

<script>
if (location.hash === '#screen') document.body.classList.add('bare','kiosk');

// scale() 은 단위 없는 수만 받으므로 JS로 계산
const FILL = .92;
if (new URLSearchParams(location.search).has('rec')) document.body.classList.add('rec');   // ?rec=1 : 영상용 (버튼·썸네일 숨김)
const fit = () => document.documentElement.style.setProperty('--s',
  Math.min(innerWidth, innerHeight) * (document.body.classList.contains('kiosk') ? 1 : FILL) /
  parseFloat(getComputedStyle(document.body).getPropertyValue('--fit')));
addEventListener('resize', fit);
fit();

/* ---------- 장면 목록 (임시 : 문구 조정 중, 헬스장 흐름을 호텔 체크인으로 옮김) ----------
   look  : idle | fill | connect | full
   hold  : 다음 장면까지 머무는 ms. 0 이면 카메라/탭 입력을 기다린다
   delay : 첫 단어가 올라오기까지의 대기(ms). 그래픽이 자리잡은 뒤에 글이 오게
   hold1 : 한 호흡으로 읽히는 짧은 문장 — 문장부호에서 쉬지 않는다             */
const SCENES = [
  { look:'idle',   hold:0 },                                                   // 얼굴 대기
  { look:'fill',   hold:0, delay:2000, out:true,                     // 01a 얼굴 인식 : 띠가 한 바퀴 돌며 한국어로 묻는다 (엄지척 대기)
    cls:'ko', text:'무엇이 필요하신가요?' },
  { look:'connect', hold:3200, out:true },                           // 01a 엄지척 인식 → 별 모션 (문구 없음)
  { look:'full',   hold:5600, delay:1300, out:true, rate:1.8,        // 01b 첫 문장 (병원 인사와 같은 속도 1.8)
    text:'It&rsquo;s been a long day,<br>Leo' },
  { look:'full',   hold:6200, delay:600, out:true, rate:1.8,         // 01c 이어지는 문장
    text:'How about some time<br>to unwind?' },
  { look:'full',   hold:5200, delay:700, rate:1.8,                   // 01d 주문을 받아 적는다 (피그마 1284:449)
    text:'I&rsquo;ll have your reserved order<br>delivered to your room.' },   // out 없음 : 다음 장면으로 끊지 않고 그대로 이어진다
  { look:'full',   flag:'send', keep:true, hold:3400 },              // 보내는 중 : 그 문장이 자리에서 옅어지고, 칩·하단 글로우·Sending
  { look:'full',   flag:'sent', fade:true, hold:8600, delay:3200, rate:1.8,     // 보냈다 : 칩이 바뀌고(기존 칩은 아래로) 다음 문장이 쓰인다
    text:'Please wait a moment.<br>Your delivery will begin in <span class="dg">5</span> minutes.' },
  { look:'bye',    hold:4200, delay:1000, hold1:true, rate:1.4,      // 마무리 : 띠와 엔딩 멘트 → 띠가 돌며 지워지고 대기 상태로 (병원과 같은 속도·시각)
    text:'Rest well, Leo!' },
];

const stage = document.querySelector('.stage');

// 텍스트를 단어(.w) 단위로 감싼다 : 줄바꿈이 단어 가운데서 일어나지 않게 하는 묶음
const split = el => {
  const walk = node => {
    for (const child of [...node.childNodes]) {
      if (child.nodeType === 3) {
        const frag = document.createDocumentFragment();
        for (const part of child.data.split(/(\s+)/)) {
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.append(part); continue; }
          const s = document.createElement('span');
          s.className = 'w'; s.textContent = part;
          frag.append(s);
        }
        child.replaceWith(frag);
      } else if (child.tagName !== 'BR') { walk(child); }
    }
  };
  walk(el);
};

// 문장 단위로 한 글자씩 (병원 로봇과 같은 규칙) : 단어 안 글자를 인라인 .c 로 쪼개 글자마다 시작 시각 --t(ms).
//  · 한 줄 안에서는 글자(띄어쓰기 한 칸 포함)가 30ms 간격으로 끊김 없이 흘러나온다 (등장 0.95s 라 겹쳐 번진다)
//  · 문장 끝(.?!…) 뒤 +450ms. 한 호흡 문장(hold1)은 쉬지 않는다
//  · 일반 글자 번짐은 옅은 색, 강조어(em)는 짙은 색. 강조어에는 첫 글자 시각 --t0, 길이 --tn, 강조어 안 순서 --ei
//  · inline span 이라 커닝이 끊기지 않는다
const GLOW_EM   = [['rgba(245,252,131,.95)', 'rgba(113,172,251,.8)'],    // 연두 · 파랑
                   ['rgba(138,255,243,.95)', 'rgba(176,150,255,.7)'],    // 하늘 · 라벤더
                   ['rgba(255,250,222,.95)', 'rgba(113,220,251,.75)']];  // 흰 핵 · 하늘
const GLOW_SOFT = GLOW_EM.map(pair => pair.map(c => c.replace(/[\d.]+\)$/, a => (parseFloat(a) * .35).toFixed(2) + ')')));
// 숫자 : 5x7 도트 (병원 로봇 길안내와 같은 글리프). 칸마다 원을 미리 깔고 켜진 칸만 불을 켠다
const NS = 'http://www.w3.org/2000/svg';   // 도트 글자·카운터 SVG
const GLYPH = {   // DGM Composta Trial 5x7 격자 실측 (병원·헬스장과 같은 표)
  0: '01110,10001,10001,10001,10001,10001,01110', 1: '11100,00100,00100,00100,00100,00100,11111',
  2: '01110,10001,00001,00110,01000,10000,11111', 3: '01110,10001,00001,00110,00001,10001,01110',
  4: '00010,00110,01010,10010,11111,00010,00010', 5: '11111,10000,10110,11001,00001,10001,01110',
  6: '00111,01000,10000,11110,10001,10001,01110', 7: '11111,00001,00001,00010,00100,00100,00100',
  8: '01110,10001,10001,01110,10001,10001,01110', 9: '01110,10001,10001,01111,00001,00010,11100',
  'T': '11111,00100,00100,00100,00100,00100,00100', 'o': '00000,00000,01110,10001,10001,10001,01110',
  '/': '00001,00010,00010,00100,01000,01000,10000', ' ': '00000,00000,00000,00000,00000,00000,00000',
};
const DP = 25, DR = 9.5, DADV = 6 * DP;   // 칸 간격 · 도트 반지름 · 글자 한 칸(5칸 + 여백 1칸). 높이 약 170px
let lastCount = 0, countRoll, countWait;
// 문장 속 숫자 한 글자 = 도트 한 칸 (병원 로봇 길안내 숫자와 같은 NDOT 대용). 크기는 글자 em 기준 : 대문자 높이 ≈ .7em
const dotGlyph = ch => {
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'dotch');
  svg.setAttribute('viewBox', `${-DR} ${-DR} ${4 * DP + 2 * DR} ${6 * DP + 2 * DR}`);
  const bits = (GLYPH[ch] ?? GLYPH[' ']).replaceAll(',', '');
  for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++) if (bits[r * 5 + c] === '1') {
    const d = document.createElementNS(NS, 'circle');
    d.setAttribute('cx', c * DP); d.setAttribute('cy', r * DP); d.setAttribute('r', DR);
    svg.append(d);
  }
  return svg;
};
// 칩의 'To' 도 같은 도트 글자 (스테이지 밖이라 한 번만 그려 둔다)
for (const el of document.querySelectorAll('.chip .dg')) {
  const txt = el.textContent; el.textContent = '';
  for (const ch of txt) el.append(dotGlyph(ch));
}

const glyphInto = (g, ch) => {
  const bits = GLYPH[ch].replaceAll(',', '');
  [...g.children].forEach((d, n) => d.classList.toggle('on', bits[n] === '1'));
};
// 도트 카운트를 그리고 이전 숫자에서 목표 숫자까지 한 칸씩 올린다. 끝나는 시각(ms)을 돌려준다
const drawCount = (el, to, total, start) => {
  const slots = String(total).length;   // 총 횟수 자릿수만큼 자리를 미리 잡는다 : 3/10 · 10/10 모두 "/" 가 같은 자리에 있어 세트 내내 숫자가 옮겨 다니지 않는다
  const chars = slots + 1 + String(total).length;
  const w = (chars - 1) * DADV + 4 * DP + 2 * DR, h = 6 * DP + 2 * DR;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'countdots');
  svg.setAttribute('width', w); svg.setAttribute('height', h);
  svg.setAttribute('viewBox', `${-DR} ${-DR} ${w} ${h}`);
  svg.style.animationDelay = start + 'ms';
  const groups = [...Array(chars)].map((_, i) => {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('transform', `translate(${i * DADV},0)`);
    if (i >= slots) g.setAttribute('class', 'dim');
    for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++) {
      const d = document.createElementNS(NS, 'circle');
      d.setAttribute('cx', c * DP); d.setAttribute('cy', r * DP); d.setAttribute('r', DR);
      g.append(d);
    }
    svg.append(g);
    return g;
  });
  const show = v => [...String(v).padStart(slots, ' ')].forEach((ch, i) => glyphInto(groups[i], ch));
  [...('/' + total)].forEach((ch, i) => glyphInto(groups[slots + i], ch));
  el.append(svg);
  let v = Math.min(lastCount, to);
  const steps = to - v;
  show(v);
  lastCount = to;
  countWait = setTimeout(() => {
    countRoll = setInterval(() => { v >= to ? clearInterval(countRoll) : show(++v); }, 110);
  }, start + 250);
  return start + 250 + steps * 110 + 200;
};

const STEP = 30;
const letters = (el, t, hold1, rate = 1) => {
  const words = [...el.querySelectorAll('.w')];
  words.forEach((w, wi) => {
    const text = w.textContent; w.textContent = '';
    const em = !!w.closest('em');
    [...text].forEach((ch, j) => {
      const c = document.createElement('span');
      c.className = 'c'; c.textContent = ch;
      c.style.setProperty('--t', Math.round(t));
      const [g1, g2] = (em ? GLOW_EM : GLOW_SOFT)[(wi + j) % 3];
      c.style.setProperty('--g1', g1); c.style.setProperty('--g2', g2);
      w.append(c);
      t += STEP * rate;
    });
    const next = words[wi + 1];
    if (next) {
      const lineBreak = next.closest('.ln') !== w.closest('.ln');
      const endsSentence = /[.?!…]$/.test(text);
      t += (STEP + (!hold1 && endsSentence ? 450 : 0) + (lineBreak && endsSentence ? 380 : 0)) * rate;   // 한 문장이 두 줄로 넘어갈 땐 쉬지 않는다
    }
  });
  // 두 줄 : 둘째 줄 첫 글자 시각(--t2) — 그때 문장이 반 줄 위로 올라간다
  const lns = el.querySelectorAll('.ln');
  el.classList.toggle('two', lns.length > 1);
  if (lns.length > 1) el.style.setProperty('--t2', lns[1].querySelector('.c')?.style.getPropertyValue('--t') ?? 0);
  el.querySelectorAll('em').forEach(em => {
    const cs = [...em.querySelectorAll('.c')];
    if (!cs.length) return;
    const t0 = +cs[0].style.getPropertyValue('--t'), t1 = +cs.at(-1).style.getPropertyValue('--t');
    em.style.setProperty('--t0', t0); em.style.setProperty('--tn', t1 - t0);
    cs.forEach((c, n) => c.style.setProperty('--ei', n));
  });
  return t;
};

// 앞 문장을 제자리에 둔 채 옅어지며 흐려져 사라지게 한다 (지우고 다시 그리면 장면이 끊긴다)
const fadeOutStage = () => {
  for (const el of [...stage.children]) {
    const top = el.offsetTop;
    el.style.position = 'absolute'; el.style.left = '130px'; el.style.right = '130px'; el.style.top = top + 'px';
    el.style.transition = 'opacity .55s ease, filter .55s ease';
    requestAnimationFrame(() => { el.style.opacity = '0'; el.style.filter = 'blur(6px)'; });
    setTimeout(() => el.remove(), 620);
  }
};
const draw = s => {
  // 엄지척(별 모션)은 앞의 한국어 문장 위로 올라온다 : 그 장면에선 문장을 지우지 않는다 (병원·헬스장과 같다)
  if (s.fade) fadeOutStage();                                     // 앞 문장은 제자리에서 녹아 사라진다 (끊지 않고 이어서)
  else if (!s.keep && (s.text || s.count || s.meta || s.look !== 'connect')) stage.replaceChildren();
  stage.classList.remove('out');
  stage.dataset.tone = s.tone ?? '';
  let t = s.delay ?? 200;
  clearTimeout(countWait); clearInterval(countRoll);
  if (!s.count) lastCount = 0;   // 세트가 끝나면 다음 세트는 0 부터 센다
  for (const [cls, html] of [['count', s.count], ['headline', s.text], ['meta', s.meta]]) {
    if (!html) continue;
    const el = document.createElement(cls === 'count' ? 'div' : 'p');
    el.className = cls + (cls === 'headline' && s.cls ? ' ' + s.cls : '');
    stage.append(el);
    if (cls === 'count') {
      const [, v, total] = /^(\d+)<u>\/(\d+)<\/u>$/.exec(html);
      t = drawCount(el, +v, +total, t) + 380;   // 숫자가 다 올라간 뒤 문장이 이어진다
      continue;
    }
    // 두 줄 문장 : 줄마다 .ln 으로 묶어야 둘째 줄이 나올 때 함께 위로 올라간다
    el.innerHTML = '<span class="ln">' + html.replaceAll('<br>', '</span><span class="ln">') + '</span>';
    split(el);
    // 카운터 → 문장 → 보조 문구 : 줄마다 한 박자(380ms) 쉬고 이어서 흘러나온다
    t = letters(el, t, s.hold1, s.rate) + 380;
  }
  for (const c of stage.querySelectorAll('.dg .c')) c.replaceChildren(dotGlyph(c.textContent));
  // 강조어(em)에 글리밍 겹 한 장 (시각은 letters 가 준 --t0 · --tn)
  for (const em of stage.querySelectorAll('em')) {
    em.classList.add('glim');
    em.dataset.t = em.textContent;
  }
};

const body = document.body;
let idx = 0, timer;

const field = document.querySelector('.field');
const star = document.querySelector('.star');
// ---------- 연결 장면의 색 띠 (캔버스) ----------
// 2.1s : 12시부터 시계 방향으로 1.7s 동안 한 바퀴 (머리 30° 흐림, 한 바퀴를 채우면 꼬리도 메워 이음매 없이)
//        도는 동안 두 띠를 옆구리까지 넓혀(ext 1) 둘레가 한 줄로 이어지게 → 3.8s 부터 1.4s 동안 원래 위·아래로 물러남
// out  : 문구와 함께 .9s 동안 옅어진다
const bandc = document.querySelector('.bandc'), bx = bandc.getContext('2d');
const bandTmp = new OffscreenCanvas(540, 540), tx = bandTmp.getContext('2d');
const bez = (x1, y1, x2, y2) => x => {   // CSS cubic-bezier 와 같은 곡선
  let lo = 0, hi = 1, t = x;
  for (let i = 0; i < 24; i++) { t = (lo + hi) / 2; const bx = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3; bx < x ? lo = t : hi = t; }
  return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3;
};
const sweepEase = bez(.45, .05, .25, 1), extEase = bez(.4, 0, .2, 1);
const clamp01 = v => Math.min(1, Math.max(0, v));
const BANDS = [
  { stops: [[.44, 'rgba(15,22,39,0)'], [.70, 'rgba(15,22,39,.3)'], [.88, 'rgba(15,22,39,.62)'], [.98, '#0F1627'], [1, '#0F1627']],
    lin: e => [[0, 1], [.06 + .29 * e, 1], [.20 + .32 * e, .9], [.32 + .34 * e, .55], [.58 + .34 * e, 0]], top: true },
  { stops: [[.52, 'rgba(61,61,61,0)'], [.78, 'rgba(61,61,61,.12)'], [.92, 'rgba(61,61,61,.24)'], [.99, 'rgba(61,61,61,.62)'], [1, 'rgba(61,61,61,.62)']],
    lin: e => [[0, 1], [.02 + .30 * e, 1], [.12 + .33 * e, .5], [.26 + .36 * e, .26], [.46 + .36 * e, 0]], top: false },
];
const drawBands = (a0, a1, ext, alpha, endFade = 0, bandAlpha = [1, 1]) => {
  bx.clearRect(0, 0, 540, 540);
  if (alpha <= 0 || a1 <= a0) return;
  // 원뿔 마스크 (각도는 12시 기준, 시계 방향) : 꼬리 a0 → +30° 불투명 … 머리 a1-30° → a1 투명
  const p = a => clamp01(a / 360);
  const o1 = p(Math.min(a0 + 30, a1 - 30)), o2 = Math.max(o1, p(a1 - 30)), o3 = Math.max(o2, p(a1));
  const cone = tx.createConicGradient(-Math.PI / 2, 270, 270);
  cone.addColorStop(p(a0), 'rgba(0,0,0,0)'); cone.addColorStop(Math.max(p(a0), o1), '#000');
  if (endFade > 0) {   // 지울 때 : 12시 바로 왼쪽(끝)도 함께 흐려 이음매가 서지 않게
    const oe = Math.max(o1, 1 - 40 / 360 * endFade);
    cone.addColorStop(oe, '#000'); cone.addColorStop(1, `rgba(0,0,0,${(1 - endFade).toFixed(3)})`);
  } else { cone.addColorStop(o2, '#000'); cone.addColorStop(o3, 'rgba(0,0,0,0)'); }
  BANDS.forEach((B, bi) => {
    tx.globalCompositeOperation = 'source-over'; tx.clearRect(0, 0, 540, 540);
    const rg = tx.createRadialGradient(270, 270, 0, 270, 270, 265);
    B.stops.forEach(([o, c]) => rg.addColorStop(o, c));
    tx.fillStyle = rg; tx.fillRect(0, 0, 540, 540);
    tx.globalCompositeOperation = 'destination-in';
    const lg = B.top ? tx.createLinearGradient(0, 0, 0, 540) : tx.createLinearGradient(0, 540, 0, 0);
    B.lin(ext).forEach(([o, a]) => lg.addColorStop(clamp01(o), `rgba(0,0,0,${a})`));
    tx.fillStyle = lg; tx.fillRect(0, 0, 540, 540);
    tx.fillStyle = cone; tx.fillRect(0, 0, 540, 540);
    bx.globalAlpha = alpha * bandAlpha[bi]; bx.drawImage(bandTmp, 0, 0); bx.globalAlpha = 1;
  });
};
let bandRAF;
// 인사 뒤 : 12시부터 돌며 띠를 지운다 (그 사이 구슬이 떠오른다)
const eraseBands = () => {
  cancelAnimationFrame(bandRAF);
  body.classList.add('eraseb'); bandc.classList.add('on');
  const t0 = performance.now();
  const f = () => {
    const t = (performance.now() - t0) / 1000;
    if (t > 1.4) { bx.clearRect(0, 0, 540, 540); bandc.classList.remove('on'); body.classList.remove('eraseb'); return; }
    drawBands(400 * sweepEase(clamp01(t / 1.3)) - 40, 400, 0, 1, clamp01(t / .35));
    bandRAF = requestAnimationFrame(f);
  };
  f();
};
const bandsRun = (look = 'fill') => {
  cancelAnimationFrame(bandRAF);
  const t0 = performance.now(); let outAt = 0;
  const frame = () => {
    if (!body.classList.contains(look)) { bx.clearRect(0, 0, 540, 540); return; }
    const t = (performance.now() - t0) / 1000;
    const a1 = 390 * sweepEase(clamp01((t - .3) / 1.7));
    const a0 = t < 1.7 ? 0 : -30 * clamp01((t - 1.7) / .3);
    const ext = t < 2 ? 1 : 1 - extEase(clamp01((t - 2) / 1.4));
    if (body.classList.contains('out') && !outAt) outAt = t;
    const alpha = outAt ? 1 - clamp01((t - outAt) / .9) : 1;
    drawBands(a0, a1, ext, alpha);
    bandRAF = requestAnimationFrame(frame);
  };
  frame();
};

// 안내를 보고 있지 않으면(15s 무응답 · 사람이 4s 안 보이면) 문구가 아래로 빠지며 대기 상태로 (병원과 같다)
const leaveFill = () => {
  if (!body.classList.contains('fill') || body.classList.contains('leave')) return;
  body.classList.add('leave');
  clearTimeout(timer); timer = setTimeout(() => go(0), 850);
};
window.__leaveFill = leaveFill;
const go = n => {
  clearTimeout(timer);
  attnStop();
  idx = n;
  const s = SCENES[n];
  // idle 에서 나갈 때 : 배회 애니메이션을 끊으면 translate 가 0 으로 튀어 다른 물체처럼 보인다.
  // 지금 값을 인라인으로 물려 class 를 바꾸고 다음 프레임에 지워, 전환이 그 자리에서 이어지게 한다
  const freeze = body.classList.contains('idle') && s.look !== 'idle';
  const cs = freeze && getComputedStyle(field);
  field.style.translate = field.style.rotate = field.style.borderRadius = field.style.scale = '';
  if (freeze) {
    field.style.translate = cs.translate; field.style.rotate = cs.rotate;
    field.style.borderRadius = cs.borderRadius; field.style.scale = cs.scale;
    // 엄지척(connect)으로 바로 가면 그 자세 그대로 옅어지게 둔다. 다른 장면은 다음 프레임에 풀어 전환이 이어지게
    if (s.look !== 'connect') requestAnimationFrame(() => requestAnimationFrame(() => {
      field.style.translate = field.style.rotate = field.style.borderRadius = field.style.scale = '';
    }));
  }
  if (s.look === 'idle' && body.classList.contains('bye')) eraseBands();   // 인사 뒤 : 띠를 돌려 지우며 대기 상태로
  body.className = [
    body.classList.contains('bare')  ? 'bare'  : '',
    body.classList.contains('kiosk') ? 'kiosk' : '',
    body.classList.contains('shot')  ? 'shot'  : '',   // 투명 배경 내보내기 유지
    body.classList.contains('nocam') ? 'nocam' : '',   // 카메라 영역 토글도 장면이 바뀌어도 남는다
    body.classList.contains('rec')   ? 'rec'   : '',   // 영상용 플래그도 장면이 바뀌어도 남는다
    s.look, s.flag ?? '',
  ].filter(Boolean).join(' ');
  draw(s);
  if (s.look === 'fill' || s.look === 'bye') requestAnimationFrame(() => bandsRun(s.look));
  if (s.look === 'fill') { window.__fillAt = performance.now(); timer = setTimeout(leaveFill, 15000); }
  // 연결 : 별 모션만. 스트로크는 다음 장면(full)에서 처음부터 켜진다
  if (s.look === 'connect') { star.currentTime = 0; star.play().catch(() => {}); }
  else star.pause();
  // out : 머문 뒤 문구를 먼저 다 지우고(.9s) 넘어간다
  if (s.hold) timer = setTimeout(() => {
    const nx = n + 1 >= SCENES.length ? 0 : n + 1;
    if (!s.out) return go(nx);
    stage.classList.add('out'); body.classList.add('out');
    timer = setTimeout(() => go(nx), 900);
  }, s.hold);
};
// 카메라가 없을 때의 수동 진행 : 한 단계씩, 마지막에서 리셋
const tap = () => go(idx >= SCENES.length - 1 ? 0 : idx + 1);
window.__go = go; window.__step = () => idx;

// ---------- 눈길 끌기 : 네 알 분리 → 부드럽게 십자로 → 두근두근(4.4s) → 가운데로 합쳐져 구슬로 ----------
// 자리는 피그마 프레임 실측 (스크린 반지름 520 기준, 가운데에서의 거리)
const ADOTS = [...document.querySelectorAll('.ad')];
const CLUSTER = [[-26, -94], [77, -40], [0, 65], [-26, 0]];        // 2번째 프레임 : 막 갈라진 덩어리
const CROSS = [[0, -210], [212, 0], [0, 212], [-212, 0]];          // 3번째 프레임 : 자리 잡고 두근두근
const BEAT = 1100, BEATS = 4, SETTLE = 1500, MERGE = 700;
let attnAnims = [], attnEnd;
const attnStop = () => {
  clearTimeout(attnEnd);
  attnAnims.forEach(a => a.cancel()); attnAnims = [];
  body.classList.remove('attn');
};
const attn = () => {
  if (!body.classList.contains('idle') || body.classList.contains('listen') || attnAnims.length) return;
  // 지금 구슬이 있는 자리에서 갈라진다
  const sc = document.querySelector('.screen').getBoundingClientRect(), fr = field.getBoundingClientRect();
  const k = 1080 / sc.width;
  const O = [((fr.left + fr.width / 2) - (sc.left + sc.width / 2)) * k, ((fr.top + fr.height / 2) - (sc.top + sc.height / 2)) * k];
  body.classList.add('attn');
  const beatEnd = SETTLE + BEAT * BEATS, total = beatEnd + MERGE;
  const at = ms => ms / total;
  const px = ([x, y]) => `${x.toFixed(1)}px ${y.toFixed(1)}px`;
  ADOTS.forEach((d, i) => {
    const lag = i * 40;   // 한 알씩 살짝 엇갈려 살아 있는 느낌
    const [cx, cy] = CROSS[i];
    attnAnims.push(d.animate([
      { offset: 0,               translate: px(O),                                  opacity: 0, easing: 'cubic-bezier(.2,.8,.3,1)' },
      { offset: at(260 + lag),   translate: px([O[0] + CLUSTER[i][0] * .6, O[1] + CLUSTER[i][1] * .6]), opacity: 1, easing: 'cubic-bezier(.4,0,.2,1)' },
      // 흩어지는 단계 없이 곧장 십자로 : 길게 감속하며 아주 살짝(3%) 넘쳤다 제자리
      { offset: at(1150 + lag),  translate: px([cx * 1.03, cy * 1.03]),             opacity: 1, easing: 'cubic-bezier(.45,0,.55,1)' },
      { offset: at(SETTLE),      translate: px(CROSS[i]),                           opacity: 1 },
      { offset: at(beatEnd),     translate: px(CROSS[i]),                           opacity: 1, easing: 'cubic-bezier(.5,0,.3,1)' },
      { offset: 1,               translate: '0px 0px',                              opacity: 0 },
    ], { duration: total, fill: 'forwards' }));
    // 크기 : 덩어리일 땐 커다랗게(구슬 크기) → 한 알 크기 → 두근두근 (쿵-쿵 두 번씩) → 합쳐지며 다시 커진다
    const sk = [{ offset: 0, scale: 1.7, easing: 'cubic-bezier(.4,0,.2,1)' }, { offset: at(900), scale: 1 }, { offset: at(SETTLE), scale: 1 }];
    for (let b = 0; b < BEATS; b++) {
      const t0 = SETTLE + b * BEAT + lag;
      sk.push({ offset: at(t0 + 130), scale: 1.22, easing: 'cubic-bezier(.3,0,.4,1)' },
              { offset: at(t0 + 270), scale: .98 },
              { offset: at(t0 + 400), scale: 1.13 },
              { offset: at(t0 + 620), scale: 1 });
    }
    sk.push({ offset: at(beatEnd), scale: 1, easing: 'cubic-bezier(.5,0,.3,1)' }, { offset: 1, scale: 1.9 });
    attnAnims.push(d.animate(sk, { duration: total, fill: 'forwards' }));
  });
  // 합쳐지기 시작할 때 구슬이 가운데에서 다시 떠오르고(1.2s) 배회로 돌아간다(k 1.1s)
  attnEnd = setTimeout(() => {
    body.classList.remove('attn');
    attnEnd = setTimeout(() => { attnAnims.forEach(a => a.cancel()); attnAnims = []; }, MERGE + 50);
  }, beatEnd);
};
window.__attn = attn;
addEventListener('keydown', e => { if (e.key === 'a' || e.key === 'A') attn(); });

const toggle = document.querySelector('.toggle');
toggle.addEventListener('pointerdown', e => e.stopPropagation());
toggle.addEventListener('click', () => {
  const off = body.classList.toggle('bare');
  toggle.setAttribute('aria-pressed', String(!off));
  fit();
});
const camToggle = document.querySelector('.toggle.camt');
camToggle.addEventListener('pointerdown', e => e.stopPropagation());
camToggle.addEventListener('click', e => {
  e.stopPropagation();
  camToggle.setAttribute('aria-pressed', String(!body.classList.toggle('nocam')));
});

const SOLO = new URLSearchParams(location.search).get('s');

if (SOLO === null) {
  addEventListener('pointerdown', tap);
  addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') tap(); });
  go(0);
} else {
  // 한 장면만 정지 : 자동 진행도 카메라도 없다
  body.classList.add('bare', 'kiosk', 'shot');
  go(+SOLO);
  clearTimeout(timer);
  fit();
}
</script>

<script type="module">
/* ---------- 카메라 인터랙션 (병원 로봇과 동일 스펙) ----------
   장면 0 : 얼굴이 가까워지면(≈30cm 이내) 원이 커진다
   언제든 : 엄지척을 올리면 거리·장면에 상관없이 연결(connect)로 넘어간다
   카메라/권한이 없으면 조용히 꺼지고 탭 조작만 남는다. */

// ponytail: 웹캠 화각마다 다르므로 실기기에서 이 값들만 보정한다.
const NEAR = .34;   // 얼굴 폭 ÷ 프레임 폭. 화각 65° 기준 0.34 ≈ 30cm, 0.5 ≈ 20cm
const HITS = 3;     // 트리거까지 필요한 누적 프레임
const GMIN = .35;   // 엄지척으로 인정할 최소 점수

const V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18';
const M = 'https://storage.googleapis.com/mediapipe-models';
const stat  = document.querySelector('.camstat');
const video = document.getElementById('camv');
const cv    = document.getElementById('camc');
const cx    = cv.getContext('2d');
const say   = t => { stat.textContent = t; };

let fd, gr, hits = 0, last = -1, faceAt = 0;
const AWAY = 5000;   // 첫 화면에서 얼굴(시선)이 이만큼 안 보이면 눈길 끌기
let seen = performance.now();

const loop = () => {
  requestAnimationFrame(loop);
  const t = performance.now();
  if (t - last < 100) return;          // 10fps 면 충분
  last = t;
  if (!video.videoWidth) return;

  const face = fd.detectForVideo(video, t).detections[0];
  const hand = gr.recognizeForVideo(video, t);
  const ratio = face ? face.boundingBox.width / video.videoWidth : 0;
  const g = (hand.gestures ?? []).map(c => c[0]).filter(Boolean)
              .sort((x, y) => y.score - x.score)[0];
  const up = (hand.gestures ?? []).some(c => c.some(k => k.categoryName === 'Thumb_Up' && k.score >= GMIN));

  const sx = cv.width / video.videoWidth, sy = cv.height / video.videoHeight;
  cx.clearRect(0, 0, cv.width, cv.height);
  if (face) {
    const b = face.boundingBox;
    cx.strokeStyle = ratio >= NEAR ? '#3ddc84' : '#ffcc00';
    cx.lineWidth = 3;
    cx.strokeRect(b.originX * sx, b.originY * sy, b.width * sx, b.height * sy);
  }
  for (const marks of hand.landmarks ?? []) {
    cx.fillStyle = up ? '#3ddc84' : '#4aa8ff';
    for (const p of marks) {
      cx.beginPath(); cx.arc(p.x * cv.width, p.y * cv.height, 3, 0, 6.284); cx.fill();
    }
  }

  const n = window.__step();
  if (face) faceAt = t;
  if (n === 1 && t - Math.max(faceAt, window.__fillAt || 0) > 4000) window.__leaveFill();   // 안내를 보고 있지 않으면
  if (face || n !== 0 || document.body.classList.contains('attn')) seen = t;   // 끝나고 다시 5초를 센다
  else if (t - seen > AWAY) { seen = t; window.__attn(); }
  say('얼굴 ' + (ratio ? Math.round(ratio * 100) + '%' : '—') + ' / ' + Math.round(NEAR * 100) + '%\n'
    + '제스처 ' + (g ? g.categoryName + ' ' + g.score.toFixed(2) : '—') + '\n'
    + '소리 ' + Math.round(window.__db ?? -99) + ' / ' + window.__LOUD + ' dB\n'
    + (n === 2 ? '연결됨' : '엄지척을 올리면 연결'));

  // 트리거 : 놓친 프레임 하나에 초기화되지 않게 깎기만 한다
  // 엄지척은 거리와 장면에 상관없이 언제든 연결(connect)로. 얼굴 근접은 첫 화면에서만 원을 키운다
  const CONNECT = 2;
  const to = up && n !== CONNECT ? CONNECT : n === 0 && ratio >= NEAR ? 1 : 0;
  hits = to ? hits + 1 : Math.max(0, hits - 1);
  if (to && hits >= HITS) { hits = 0; window.__go(to); }
};

if (new URLSearchParams(location.search).has('s')) say('');
else try {
  const { FilesetResolver, FaceDetector, GestureRecognizer } = await import(V + '/vision_bundle.mjs');
  const vision = await FilesetResolver.forVisionTasks(V + '/wasm');
  [fd, gr] = await Promise.all([
    FaceDetector.createFromOptions(vision, { runningMode: 'VIDEO',
      baseOptions: { modelAssetPath: M + '/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' } }),
    GestureRecognizer.createFromOptions(vision, { runningMode: 'VIDEO', numHands: 2,
      minHandDetectionConfidence: .4, minHandPresenceConfidence: .4, minTrackingConfidence: .4,
      cannedGesturesClassifierOptions: { scoreThreshold: .2 },
      baseOptions: { modelAssetPath: M + '/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task' } }),
  ]);
  say('카메라 권한을 허용해 주세요');
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
  await video.play();
  say('카메라 ON');
  requestAnimationFrame(loop);
} catch (e) {
  say('카메라 없음 — 화면을 탭해 진행');
  console.warn('[cam]', e);
}
</script>

<script type="module">
/* ---------- 소리 인터랙션 (호텔만) ----------
   장면 0 에서 큰 소리(말을 걸면) → 원이 가운데로 모여 또렷해진다 = 집중해서 듣고 있다.
   마지막 큰 소리 뒤 5초가 지나면 다시 배회. 마이크가 없으면 L 키로 흉내낸다.
   AudioContext 는 화면을 한 번 눌러야 켜지는데 첫 화면에서 누르면 다음 장면으로 넘어가 버린다 → 트랙에서 샘플을 직접 읽는다. */

// ponytail: 마이크·공간마다 다르므로 실기기에서 LOUD 만 보정한다 (카메라 창에 최근 최대 dB 가 뜬다)
// 박수는 짧고 뾰족해서 평균(RMS)이 아니라 순간 최댓값(peak)으로 잰다. 보통 대화 -35 ~ -20, 박수는 순간값이 훨씬 높다
const LOUD = -18;   // peak dBFS. 1~2m 박수 -18 ~ -6
const HOLD = 5000;  // 듣는 모양을 유지하는 시간(ms)
window.__LOUD = LOUD;

const body = document.body;
let off;
const listen = () => {
  if (!body.classList.contains('idle') || body.classList.contains('attn')) return;
  body.classList.add('listen');
  clearTimeout(off);
  off = setTimeout(() => body.classList.remove('listen'), HOLD);
};
window.__listen = listen;
addEventListener('keydown', e => { if (e.key === 'l' || e.key === 'L') listen(); });

// 한 묶음의 소리에서 가장 큰 순간값 → 기준을 넘으면 듣기. 화면 표시는 1초 동안 최댓값을 잡아 둔다
let shown = -99, shownAt = 0;
const hear = buf => {
  let p = 0;
  for (const v of buf) if (Math.abs(v) > p) p = Math.abs(v);
  const db = 20 * Math.log10(p + 1e-9);
  const t = performance.now();
  if (db > shown || t - shownAt > 1000) { shown = db; shownAt = t; }
  window.__db = shown;
  if (db > LOUD) listen();
};

if (!new URLSearchParams(location.search).has('s')) try {
  // 자동 음량 보정을 켜 두면 작은 소리도 크게 들려 '큰 소리' 를 가를 수 없다
  const mic = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  const track = mic.getAudioTracks()[0];
  if ('MediaStreamTrackProcessor' in window) {
    // 모든 샘플을 빠짐없이 받는다. AudioContext 와 달리 화면을 한 번 눌러야 켜지는 제약이 없다
    // (첫 화면에서 누르면 다음 장면으로 넘어가 버리므로 그 제약이 치명적이다)
    const reader = new MediaStreamTrackProcessor({ track }).readable.getReader();
    let buf = new Float32Array(0);
    for (;;) {
      const { value: frame, done } = await reader.read();
      if (done) break;
      const n = frame.numberOfFrames;
      if (buf.length < n) buf = new Float32Array(n);
      frame.copyTo(buf.subarray(0, n), { planeIndex: 0, format: 'f32-planar' });
      frame.close();
      hear(buf.subarray(0, n));
    }
  } else {
    const ac = new AudioContext();
    const an = ac.createAnalyser();
    an.fftSize = 2048;
    ac.createMediaStreamSource(mic).connect(an);
    ac.resume();
    addEventListener('pointerdown', () => ac.resume());
    const buf = new Float32Array(an.fftSize);
    setInterval(() => { an.getFloatTimeDomainData(buf); hear(buf); }, 20);
  }
} catch (e) {
  console.warn('[mic]', e);
}
</script>
</body>
</html>
