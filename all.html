<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hotel Robot · 전체 화면 모음</title>
<style>
  :root{ --cell: 300px; }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:48px 40px 80px; background:#0B0F18; color:#E8E8E4;
    font-family:'Delight','Pretendard','Inter',system-ui,sans-serif;
    letter-spacing:0.01em;
  }
  h1{ margin:0 0 6px; font-size:26px; font-weight:600; }
  .sub{ margin:0 0 40px; font-size:14px; line-height:1.7; color:#8c8c85; }
  .sub a{ color:#b9b9b1; }
  .grid{
    display:grid; gap:34px 26px;
    grid-template-columns:repeat(auto-fill, minmax(var(--cell), 1fr));
    max-width:1560px;
  }
  figure{ margin:0; }
  /* 화면은 1080 원본을 그대로 iframe 으로 띄우고 CSS 로만 축소한다 :
     스크린샷이 아니라 실물이라 모션도 그대로 돈다 */
  .screen{
    display:block; position:relative; width:100%; aspect-ratio:1;
    border-radius:50%; overflow:hidden; background:#000;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
  }
  .screen iframe{
    position:absolute; inset:0; width:100%; height:100%;
    border:0; display:block; pointer-events:none;
  }
  figcaption{ margin-top:12px; font-size:13px; line-height:1.55; }
  .no{ display:inline-block; min-width:26px; font-weight:600; color:#6f6f68; }
  .nm{ font-weight:600; }
  .dt{ display:block; margin-top:2px; color:#8c8c85; font-size:12px; }
  .bar{ margin:44px 0 0; font-size:13px; color:#6f6f68; }
  button{
    font:inherit; font-size:13px; padding:8px 16px; border-radius:999px;
    border:1px solid #2a3244; background:#151b28; color:#E8E8E4; cursor:pointer;
  }
</style>
</head>
<body>

<h1>Hotel Robot · 전체 화면 모음</h1>
<p class="sub">
  호텔 로봇 GUI의 모든 장면입니다 (문구 조정 중). 스크린샷이 아니라 실제 화면을 그대로 띄운 것이라 모션도 함께 돕니다.<br>
  한 장면만 크게 보려면 <button id="reload">모션 다시 재생</button> 또는 각 화면을 클릭하세요.
  전체 시나리오를 순서대로 보려면 <a href="./">index</a> 로.
</p>

<div class="grid" id="grid"></div>

<p class="bar">dab2n/baton-hotel · 화면 원본 1080 × 1080</p>

<script>
const SCENES = [
  ['00',  '얼굴 대기',     'idle — 얼굴이 가까워지면 원이 커진다'],
  ['01a', '엄지척 대기',   'Hello, may I help you check in?'],
  ['01a', '예약 조회',     'search — 예약 정보를 불러오는 중'],
  ['01b', '인사',         'Welcome, Leo.'],
  ['01c', '예약 확인',     'Deluxe King · 2 nights / Check-out Sep 20'],
  ['02a', '체크인',       'Checking you in…'],
  ['02b', '객실 배정',     'Your room is ready. · Room 1207'],
  ['03a', '안내 시작',     'Follow me. · To the elevator'],
  ['03b', '엘리베이터 3/12',  'Going up.'],
  ['03c', '엘리베이터 7/12',  'Almost there.'],
  ['03d', '도착 12/12',    '12th floor. / This way, please.'],
  ['04a', '객실 도착',     'Here is your room. · 1207'],
  ['04b', '이용 안내',     'Breakfast 7–10 AM · 2F / Wi-Fi'],
  ['04c', '작별',         'Enjoy your stay, Leo.'],
];

const grid = document.getElementById('grid');
const build = () => {
  grid.replaceChildren();
  SCENES.forEach(([no, name, detail], i) => {
    const fig = document.createElement('figure');
    fig.innerHTML =
      '<a class="screen" href="index.html?s=' + i + '" target="_blank" rel="noopener">' +
        '<iframe src="index.html?s=' + i + '" loading="lazy" title="' + no + ' ' + name + '"></iframe>' +
      '</a>' +
      '<figcaption><span class="no">' + no + '</span> <span class="nm">' + name + '</span>' +
      '<span class="dt">' + detail + '</span></figcaption>';
    grid.append(fig);
  });
};
build();
document.getElementById('reload').addEventListener('click', build);
</script>
</body>
</html>
